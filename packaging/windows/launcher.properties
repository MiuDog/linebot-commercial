# 桌面 launcher 固定啟用桌面模式，server 與 Docker 仍直接執行 app.jar。
arguments=--app.desktop.enabled=true

# JDK 25 允許 JNA DPAPI 與 SQLite JDBC 載入必要原生程式庫。
java-options=--enable-native-access=ALL-UNNAMED

# Desktop JVM property 不受使用者提供 --shutdown／--configure 取代預設 arguments 影響。
desktop-java-option=-Dapp.desktop.enabled=true
