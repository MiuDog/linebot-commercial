# 測試保留 SQLite，以快速覆蓋既有業務規則；正式 runtime 只使用 PostgreSQL／Flyway。
spring.config.import=optional:file:./src/main/resources/application.properties
LEGACY_SQLITE_ENABLED=true
LEGACY_FILESYSTEM_ENABLED=true
FLYWAY_ENABLED=false
SQL_INIT_MODE=always
DATABASE_URL=jdbc:sqlite:${java.io.tmpdir}/linebot-commercial-test.db
COMPANY_ID=test-company
OBJECT_STORAGE_ENDPOINT=http://127.0.0.1:9000
OBJECT_STORAGE_REGION=us-east-1
OBJECT_STORAGE_BUCKET=test-commercial
OBJECT_STORAGE_ACCESS_KEY=test-access
OBJECT_STORAGE_SECRET_KEY=test-secret
ADMIN_TOKEN=test-admin-token-with-sufficient-length
ADMIN_TOKEN_REQUIRED=false
