spring.application.name=assets-manager-linebot

# LINE Bot 自身的埠號
server.port=8088

# ===== LINE 憑證（由 .env / 容器環境變數帶入，不寫進版控）=====
line.bot.channel-token=${LINE_BOT_CHANNEL_TOKEN:}
line.bot.channel-secret=${LINE_BOT_CHANNEL_SECRET:}

# ===== 本地資產儲存 =====
# 圖片本體與 SQLite 索引都放在這個目錄底下（容器內對應 /app/downloads volume）
app.storage.path=${LOCAL_STORAGE_PATH:./downloads}

# LINE 伺服器抓圖用的對外 HTTPS 網址（結尾不要帶斜線）
# 測試階段填 ngrok 網址，部署階段填公司伺服器的網域
app.public-base-url=${PUBLIC_BASE_URL:}

# 單次查詢最多回傳幾張圖（LINE reply 一次上限 5 則訊息，保留 1 則給文字摘要）
app.query.max-results=${QUERY_MAX_RESULTS:4}

# ===== AI 資料提取（全部留空，請自行填入）=====
# AI_API_URL          OpenAI 相容的 chat completions 端點
# AI_API_KEY          金鑰
# AI_MODEL            模型名稱
# AI_REQUIRED_FIELDS  必要欄位，逗號分隔；留空代表不做欄位檢查
app.ai.api-url=${AI_API_URL:}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:}
app.ai.required-fields=${AI_REQUIRED_FIELDS:}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:60}

# ===== 報價單（模板與公式尚未提供，留空）=====
app.quotation.template-path=${QUOTATION_TEMPLATE_PATH:}
app.quotation.output-path=${QUOTATION_OUTPUT_PATH:}

# ===== SQLite 資產索引 =====
# DataSource 由 StorageConfig 手動建立（需要先確保 storage 目錄存在），
# 連線池與 PRAGMA 設定也一併在那裡，不走 spring.datasource.hikari.* 。
spring.datasource.url=jdbc:sqlite:${app.storage.path}/assets.db
spring.sql.init.mode=always

# ===== 健康檢查 =====
# Dockerfile 的 HEALTHCHECK 會打這個端點
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
