spring.application.name=linebot-commercial
spring.main.log-startup-info=false

# LINE Bot 自身的埠號
server.port=8088

# Docker Desktop 會將本機埠轉接顯示為私有橋接來源；僅在主機埠綁定 loopback 時啟用。
app.admin.container-host-access-enabled=${LOCAL_ADMIN_CONTAINER_HOST_ACCESS:false}

# ===== LINE 憑證（由 .env / 容器環境變數帶入，不寫進版控）=====
line.bot.channel-token=${LINE_BOT_CHANNEL_TOKEN:}
line.bot.channel-secret=${LINE_BOT_CHANNEL_SECRET:}
app.line.connect-timeout-seconds=${LINE_CONNECT_TIMEOUT_SECONDS:10}
app.line.request-timeout-seconds=${LINE_REQUEST_TIMEOUT_SECONDS:30}

# ===== 系統共同根目錄 =====
# 所有持久檔案都由這個根目錄推導，不再分別接受資產、報價與日誌路徑。
app.system.root=${SYSTEM_ROOT_PATH:${user.dir}/system-data}
app.storage.root=${app.system.root}/data

# LINE 伺服器抓圖用的對外 HTTPS 網址（結尾不要帶斜線）
# 測試階段填 ngrok 網址，部署階段填公司伺服器的網域
app.public-base-url=${PUBLIC_BASE_URL:}

# ===== AI 資料提取（全部留空，請自行填入）=====
# AI_API_URL          OpenAI 相容 API 的共同基底網址
# AI_API_KEY          金鑰
# AI_MODEL            模型名稱
# AI_REQUIRED_FIELDS  必要欄位，逗號分隔；留空代表不做欄位檢查
app.ai.api-url=${AI_API_URL:}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:}
app.ai.required-fields=${AI_REQUIRED_FIELDS:}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:60}

# ===== AI token 成本稽核（每百萬 token 費率） =====
# 三種費率都設定後才計算金額；任一空白會保留 token 並標記 UNCONFIGURED。
app.ai.pricing.currency=${AI_PRICE_CURRENCY:USD}
app.ai.pricing.input-per-million=${AI_INPUT_RATE_PER_MILLION:}
app.ai.pricing.cached-input-per-million=${AI_CACHED_INPUT_RATE_PER_MILLION:}
app.ai.pricing.output-per-million=${AI_OUTPUT_RATE_PER_MILLION:}

# ===== 報價單 =====
# 模板由 Maven 內嵌，輸出服務會在共同根目錄下自動建立「報價單/」。
app.quotation.template-path=classpath:quotation/templates
app.quotation.output-path=${app.system.root}/\u5831\u50F9\u55AE
app.quotation.root-path=${app.system.root}
app.quotation.tax-rate=${QUOTATION_TAX_RATE:0.05}
app.quotation.validity-days=${QUOTATION_VALIDITY_DAYS:15}
app.quotation.pdf-timeout-seconds=${QUOTATION_PDF_TIMEOUT_SECONDS:90}
app.quotation.delivery-link-ttl-hours=${QUOTATION_DELIVERY_LINK_TTL_HOURS:168}
app.quotation.generation-queue-capacity=${QUOTATION_GENERATION_QUEUE_CAPACITY:20}
app.quotation.generation-lease-seconds=${QUOTATION_GENERATION_LEASE_SECONDS:120}
app.quotation.generation-batch-size=${QUOTATION_GENERATION_BATCH_SIZE:20}
app.quotation.generation-poll-interval-ms=${QUOTATION_GENERATION_POLL_INTERVAL_MS:5000}
app.quotation.generation-poll-initial-delay-ms=${QUOTATION_GENERATION_POLL_INITIAL_DELAY_MS:5000}
app.quotation.generation-worker-enabled=${QUOTATION_GENERATION_WORKER_ENABLED:true}

# ===== SQLite 資產索引 =====
# DataSource 由 StorageConfig 手動建立（需要先確保 storage 目錄存在），
# 連線池與 PRAGMA 設定也一併在那裡，不走 spring.datasource.hikari.* 。
spring.datasource.url=jdbc:sqlite:${app.storage.root}/assets.db
spring.sql.init.mode=always

# ===== 健康檢查 =====
# Dockerfile 的 HEALTHCHECK 會打這個端點
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# ===== 流程追蹤 =====
# 啟用後會記錄所有 Spring 管理的公開方法：進入、完成時間與例外類型。
# 不記錄方法參數與回傳內容，避免 token、訊息內容或圖片資料進入 log。
app.observability.method-tracing-enabled=${METHOD_TRACING_ENABLED:false}
app.observability.log-path=${app.system.root}/log
app.observability.resource-interval-ms=${RESOURCE_LOG_INTERVAL_MS:60000}
