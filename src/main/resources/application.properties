spring.application.name=linebot-commercial
spring.main.log-startup-info=false
spring.config.import=optional:configtree:/run/secrets/,optional:configtree:/run/ai-secrets/

# LINE Bot 自身的埠號
server.port=8088

# Docker Desktop 會將本機埠轉接顯示為私有橋接來源；僅在主機埠綁定 loopback 時啟用。
app.admin.container-host-access-enabled=${LOCAL_ADMIN_CONTAINER_HOST_ACCESS:false}
app.admin.local-only=${ADMIN_LOCAL_ONLY:true}
app.admin.token=${ADMIN_TOKEN:}
app.admin.token-required=${ADMIN_TOKEN_REQUIRED:true}

# ===== 部署身分與公司資產 =====
# 一套部署只服務一家公司；此值同時是資料列與物件 key 的租戶邊界。
app.company.id=${COMPANY_ID:}

# MinIO 與公有雲 S3 共用此介面；雲端使用 IAM 時可將 access/secret 留空。
app.object-storage.endpoint=${OBJECT_STORAGE_ENDPOINT:}
app.object-storage.region=${OBJECT_STORAGE_REGION:us-east-1}
app.object-storage.bucket=${OBJECT_STORAGE_BUCKET:}
app.object-storage.access-key=${OBJECT_STORAGE_ACCESS_KEY:}
app.object-storage.secret-key=${OBJECT_STORAGE_SECRET_KEY:}
app.object-storage.force-path-style=${OBJECT_STORAGE_FORCE_PATH_STYLE:false}

# ===== LINE 憑證（由 .env / 容器環境變數帶入，不寫進版控）=====
line.bot.channel-token=${LINE_BOT_CHANNEL_TOKEN:}
line.bot.channel-secret=${LINE_BOT_CHANNEL_SECRET:}
app.line.connect-timeout-seconds=${LINE_CONNECT_TIMEOUT_SECONDS:10}
app.line.request-timeout-seconds=${LINE_REQUEST_TIMEOUT_SECONDS:30}

# ===== 系統共同根目錄 =====
# 所有持久檔案都由這個根目錄推導，不再分別接受資產、報價與日誌路徑。
app.system.root=${SYSTEM_ROOT_PATH:${user.dir}/system-data}
app.storage.root=${app.system.root}/data
app.storage.legacy-filesystem-enabled=${LEGACY_FILESYSTEM_ENABLED:false}

# LINE 伺服器抓圖用的對外 HTTPS 網址（結尾不要帶斜線）
# 測試階段填 ngrok 網址，部署階段填公司伺服器的網域
app.public-base-url=${PUBLIC_BASE_URL:}

# ===== AI 資料提取（全部留空，請自行填入）=====
# AI_API_URL          OpenAI 相容 API 的共同基底網址
# AI_API_KEY          金鑰
# AI_MODEL            模型名稱
# AI_REQUIRED_FIELDS  必要欄位，逗號分隔；留空代表不做欄位檢查
app.ai.api-url=${AI_API_URL:}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:}
app.ai.max-completion-tokens=${AI_MAX_COMPLETION_TOKENS:4000}

# 選用的多模型 workflow；關閉時完全沿用舊單模型流程。
app.ai.workflow.enabled=${AI_WORKFLOW_ENABLED:false}
app.ai.workflow.max-calls=${AI_WORKFLOW_MAX_CALLS:3}
app.ai.workflow.max-output-tokens=${AI_WORKFLOW_MAX_OUTPUT_TOKENS:12000}
app.ai.workflow.max-total-tokens=${AI_WORKFLOW_MAX_TOTAL_TOKENS:32000}
app.ai.workflow.timeout-seconds=${AI_WORKFLOW_TIMEOUT_SECONDS:120}
app.ai.workflow.text.model=${AI_TEXT_MODEL:}
app.ai.workflow.text.api-url=${AI_TEXT_API_URL:}
app.ai.workflow.text.api-key=${AI_TEXT_API_KEY:${ai-text-api-key:}}
app.ai.workflow.text.max-completion-tokens=${AI_TEXT_MAX_COMPLETION_TOKENS:${AI_MAX_COMPLETION_TOKENS:4000}}
app.ai.workflow.text.timeout-seconds=${AI_TEXT_TIMEOUT_SECONDS:60}
app.ai.workflow.vision.model=${AI_VISION_MODEL:}
app.ai.workflow.vision.api-url=${AI_VISION_API_URL:}
app.ai.workflow.vision.api-key=${AI_VISION_API_KEY:${ai-vision-api-key:}}
app.ai.workflow.vision.max-completion-tokens=${AI_VISION_MAX_COMPLETION_TOKENS:${AI_MAX_COMPLETION_TOKENS:4000}}
app.ai.workflow.vision.timeout-seconds=${AI_VISION_TIMEOUT_SECONDS:60}
app.ai.workflow.escalation.model=${AI_ESCALATION_MODEL:}
app.ai.workflow.escalation.api-url=${AI_ESCALATION_API_URL:}
app.ai.workflow.escalation.api-key=${AI_ESCALATION_API_KEY:${ai-escalation-api-key:}}
app.ai.workflow.escalation.max-completion-tokens=${AI_ESCALATION_MAX_COMPLETION_TOKENS:${AI_MAX_COMPLETION_TOKENS:4000}}
app.ai.workflow.escalation.timeout-seconds=${AI_ESCALATION_TIMEOUT_SECONDS:60}
app.ai.required-fields=${AI_REQUIRED_FIELDS:}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:60}

# ===== AI token 成本稽核（每百萬 token 費率） =====
# 三種費率都設定後才計算金額；任一空白會保留 token 並標記 UNCONFIGURED。
app.ai.pricing.currency=${AI_PRICE_CURRENCY:USD}
app.ai.pricing.input-per-million=${AI_INPUT_RATE_PER_MILLION:}
app.ai.pricing.cached-input-per-million=${AI_CACHED_INPUT_RATE_PER_MILLION:}
app.ai.pricing.output-per-million=${AI_OUTPUT_RATE_PER_MILLION:}

# ===== 報價單 =====
# 模板由 Maven 內嵌，輸出服務會在共同根目錄下自動建立「報價單/」。
app.quotation.template-path=classpath:quotation/templates
app.quotation.output-path=${app.system.root}/\u5831\u50F9\u55AE
app.quotation.root-path=${app.system.root}
app.quotation.tax-rate=${QUOTATION_TAX_RATE:0.05}
app.quotation.validity-days=${QUOTATION_VALIDITY_DAYS:15}
app.quotation.pdf-timeout-seconds=${QUOTATION_PDF_TIMEOUT_SECONDS:90}
app.quotation.libreoffice-command=${LIBREOFFICE_COMMAND:libreoffice}
app.quotation.delivery-link-ttl-hours=${QUOTATION_DELIVERY_LINK_TTL_HOURS:168}
app.quotation.generation-queue-capacity=${QUOTATION_GENERATION_QUEUE_CAPACITY:20}
app.quotation.generation-lease-seconds=${QUOTATION_GENERATION_LEASE_SECONDS:120}
app.quotation.generation-batch-size=${QUOTATION_GENERATION_BATCH_SIZE:20}
app.quotation.generation-poll-interval-ms=${QUOTATION_GENERATION_POLL_INTERVAL_MS:5000}
app.quotation.generation-poll-initial-delay-ms=${QUOTATION_GENERATION_POLL_INITIAL_DELAY_MS:5000}
app.quotation.generation-worker-enabled=${QUOTATION_GENERATION_WORKER_ENABLED:true}

# ===== PostgreSQL 與資料庫版本 =====
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/linebot_commercial}
spring.datasource.username=${DATABASE_USERNAME:linebot}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.sql.init.mode=${SQL_INIT_MODE:never}
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
app.database.legacy-sqlite-enabled=${LEGACY_SQLITE_ENABLED:false}

# ===== 一次性舊資料遷移（預設只 dry-run） =====
app.migration.enabled=${MIGRATION_ENABLED:false}
app.migration.execute=${MIGRATION_EXECUTE:false}
app.migration.legacy-database=${MIGRATION_LEGACY_DATABASE:}
app.migration.asset-root=${MIGRATION_ASSET_ROOT:}
app.migration.output-root=${MIGRATION_OUTPUT_ROOT:}
app.migration.report-path=${MIGRATION_REPORT_PATH:${java.io.tmpdir}/legacy-migration-report.json}

# ===== 健康檢查 =====
# Dockerfile 的 HEALTHCHECK 會打這個端點
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,objectStorage

# ===== 容器關閉 =====
# Kubernetes／Docker 傳入 SIGTERM 時先停止接收流量，再等待既有請求安全結束。
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:30s}

# ===== 流程追蹤 =====
# 啟用後會記錄所有 Spring 管理的公開方法：進入、完成時間與例外類型。
# 不記錄方法參數與回傳內容，避免 token、訊息內容或圖片資料進入 log。
app.observability.method-tracing-enabled=${METHOD_TRACING_ENABLED:false}
app.observability.log-path=${app.system.root}/log
app.observability.resource-interval-ms=${RESOURCE_LOG_INTERVAL_MS:60000}
