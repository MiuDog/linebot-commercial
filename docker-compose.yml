# ============================================================
# 測試階段： docker compose --profile dev up --build -d   （含 ngrok 隧道）
# 部署階段： docker compose up --build -d                 （不啟 ngrok）
#
# 所有設定都從同目錄的 .env 讀入，請先 cp .env.example .env 並填值。
#
# 所有持久資料預設位於 ./system-data，容器內固定掛在 /data/system-root。
# ============================================================

services:
  # ----------------------------------------------------------
  # LINE Bot 本體
  # ----------------------------------------------------------
  linebot:
    image: linebot-commercial
    build: .
    container_name: linebot-commercial-service
    volumes:
      # 一次掛載共同根目錄，圖片、資料庫、報價與日誌都保存在其子路徑。
      - "${SYSTEM_ROOT_PATH:-./system-data}:/data/system-root"
    # .env 內所有變數會整批帶進容器，新增 AI_* 等變數時不必回來改這個檔案
    env_file:
      - .env
    environment:
      # 容器內只覆寫共同根目錄，所有子路徑由 Spring 設定推導。
      - SYSTEM_ROOT_PATH=/data/system-root
      # 主機埠只綁 loopback，因此允許 Docker 私有橋接來源進入本機管理頁。
      - LOCAL_ADMIN_CONTAINER_HOST_ACCESS=true
    ports:
      - "127.0.0.1:8088:8088"
    # Docker Desktop 重啟後自動恢復服務，手動 stop 時則保持停止。
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8088/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  # ----------------------------------------------------------
  # 外網穿透（僅測試階段）
  #
  # 掛在 dev profile 底下，部署到公司伺服器時不會被啟動——
  # 正式環境應該用固定網域加反向代理，而不是 ngrok。
  # ----------------------------------------------------------
  ngrok:
    image: ngrok/ngrok:latest
    container_name: assets-manager-ngrok-tunnel
    profiles:
      - dev
    command:
      - "http"
      - "linebot:8088"   # 走 compose 預設網路直接穿透 linebot 容器
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"      # ngrok 本地控制台，可從這裡看到當前公開網址
    depends_on:
      - linebot
    # 測試階段讓公開 webhook 隧 Docker Desktop 一併恢復。
    restart: unless-stopped
