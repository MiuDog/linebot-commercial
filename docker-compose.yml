# ============================================================
# 測試階段： docker compose --profile dev up --build -d   （含 ngrok 隧道）
# 部署階段： docker compose up --build -d                 （不啟 ngrok）
#
# 所有設定都從同目錄的 .env 讀入，請先 cp .env.example .env 並填值。
#
# 圖片資產預設位於專案根目錄的 ./圖片資產。
# 容器內固定掛在 /data/assets。
# ============================================================

services:
  # ----------------------------------------------------------
  # LINE Bot 本體
  # ----------------------------------------------------------
  linebot:
    image: assets-manager-linebot
    build: .
    container_name: assets-manager-linebot-service
    volumes:
      # 主機的資產庫目錄掛進容器。圖片與 assets.db 都落在這裡，
      # 容器重建、甚至換一台機器都不會遺失資料。
      - "${ASSETS_ROOT:-./圖片資產}:/data/assets"
      - "${QUOTATION_ROOT_PATH:-./quotation-output}:/data/quotation-root"
    # .env 內所有變數會整批帶進容器，新增 AI_* 等變數時不必回來改這個檔案
    env_file:
      - .env
    environment:
      # 容器內的路徑與主機不同，這是唯一需要覆寫的一項
      - ASSETS_ROOT=/data/assets
      - QUOTATION_ROOT_PATH=/data/quotation-root
    ports:
      - "8088:8088"
    restart: no
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8088/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  # ----------------------------------------------------------
  # 外網穿透（僅測試階段）
  #
  # 掛在 dev profile 底下，部署到公司伺服器時不會被啟動——
  # 正式環境應該用固定網域加反向代理，而不是 ngrok。
  # ----------------------------------------------------------
  ngrok:
    image: ngrok/ngrok:latest
    container_name: assets-manager-ngrok-tunnel
    profiles:
      - dev
    command:
      - "http"
      - "linebot:8088"   # 走 compose 預設網路直接穿透 linebot 容器
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"      # ngrok 本地控制台，可從這裡看到當前公開網址
    depends_on:
      - linebot
    restart: no
