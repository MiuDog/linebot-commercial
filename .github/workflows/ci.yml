name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      # 外部 Action：取出目前 commit；完整 SHA 對應 actions/checkout v6.0.2。
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      # 外部 Action：安裝支援 Java 25 的 Temurin；完整 SHA 對應 actions/setup-java v5.6.0。
      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          check-latest: false

      # 外部工具：使用版本庫 Maven Wrapper 執行完整測試、Style gate 與 SBOM 產生。
      - name: Verify on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      # 外部工具：Windows runner 驗證 server 模式的跨平台相容性。
      - name: Verify on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mvnw.cmd --batch-mode --no-transfer-progress clean verify

  container:
    name: Container, manifests and supply chain
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Validate Compose and Kubernetes manifests
        shell: bash
        run: |
          docker compose config --quiet
          kubectl kustomize k8s/base >/tmp/manifests.yaml
          test -s /tmp/manifests.yaml

      - name: Build immutable candidate image
        shell: bash
        run: docker build --pull --tag linebot-commercial:${GITHUB_SHA} .

      - name: Create SBOM and scan image
        shell: bash
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}:/work" \
            aquasec/trivy:0.72.0 image \
            --format cyclonedx --output /work/sbom.cdx.json \
            linebot-commercial:${GITHUB_SHA}
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.72.0 image \
            --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL \
            linebot-commercial:${GITHUB_SHA}
          docker image inspect --format='imageId={{.Id}}' \
            linebot-commercial:${GITHUB_SHA} | tee image-metadata.txt

      - name: Upload SBOM and image metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linebot-commercial-supply-chain-${{ github.sha }}
          path: |
            sbom.cdx.json
            image-metadata.txt
          if-no-files-found: error
          retention-days: 30
