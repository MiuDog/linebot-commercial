name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      # 外部 Action：取出目前 commit；完整 SHA 對應 actions/checkout v6.0.2。
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      # 外部 Action：安裝支援 Java 25 的 Temurin；完整 SHA 對應 actions/setup-java v5.6.0。
      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          check-latest: false

      # 外部工具：使用版本庫 Maven Wrapper 執行完整測試、Style gate 與 SBOM 產生。
      - name: Verify on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      # 外部工具：Windows runner 同時覆蓋 DPAPI native round trip。
      - name: Verify on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mvnw.cmd --batch-mode --no-transfer-progress clean verify

      # 外部工具：只在 Windows 驗證 jpackage launcher 與自帶 Runtime 的相容性。
      - name: Verify Windows app image
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [xml]$Pom = Get-Content -LiteralPath pom.xml -Raw -Encoding utf8
          $Version = [string]$Pom.project.version
          powershell.exe -NoProfile -File scripts\package-windows-app.ps1 -Version $Version -SkipBuild

      # 外部工具：移除系統 Java 環境後執行 desktop shutdown，證明 launcher 使用 app image Runtime。
      - name: Smoke test bundled runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell.exe -NoProfile -File scripts\test-windows-app-image.ps1 -AppImagePath dist\app-image\LinebotCommercial

      # 外部工具：檢查兩份 workflow 的 SHA 鎖定與最小權限規則。
      - name: Verify workflow policy
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell.exe -NoProfile -File scripts\verify-workflows.ps1
